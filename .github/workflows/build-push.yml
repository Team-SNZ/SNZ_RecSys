name: recsys-agent - build & push (multi-arch) + deploy

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      AGENT_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/winear-recsys-agent
      INJECT_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/winear-mongo-injector
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 멀티아치 빌드를 위한 QEMU/Buildx 설정
      - name: QEMU 설치
        uses: docker/setup-qemu-action@v3

      - name: Buildx 설치
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA=${GITHUB_SHA::7}
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "is_tag=true"  >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      # 멀티아치 빌드 + 푸시 (amd64, arm64)
      # 1) 에이전트 이미지
      - name: Build & Push agent (edge + sha; multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.AGENT_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.AGENT_IMAGE }}:edge
          cache-from: type=registry,ref=${{ env.AGENT_IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.AGENT_IMAGE }}:buildcache,mode=max

      # 2) 인젝터 이미지 (별도 Dockerfile)
      - name: Build & Push injector (edge + sha; multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile.injector
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.INJECT_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.INJECT_IMAGE }}:edge
          cache-from: type=registry,ref=${{ env.INJECT_IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.INJECT_IMAGE }}:buildcache,mode=max

      # 릴리스 태그(v*)면 version + latest로 멀티아치 매니페스트 승격
      - name: Promote (version + latest) — agent
        if: steps.meta.outputs.is_tag == 'true'
        run: |
          docker buildx imagetools create \
            -t ${{ env.AGENT_IMAGE }}:${{ steps.meta.outputs.version }} \
            -t ${{ env.AGENT_IMAGE }}:latest \
            ${{ env.AGENT_IMAGE }}:${{ steps.meta.outputs.sha }}

      - name: Promote (version + latest) — injector
        if: steps.meta.outputs.is_tag == 'true'
        run: |
          docker buildx imagetools create \
            -t ${{ env.INJECT_IMAGE }}:${{ steps.meta.outputs.version }} \
            -t ${{ env.INJECT_IMAGE }}:latest \
            ${{ env.INJECT_IMAGE }}:${{ steps.meta.outputs.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: SSH deploy (compose pull & up -d)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/stack
            docker compose -f compose.yml -f compose.prod.yml pull winear-recsys-agent
            docker compose -f compose.yml -f compose.prod.yml up -d --no-build winear-recsys-agent
            docker image prune -f
            # 인젝터는 기본 up에 포함되지 않음(필요 시 init 프로파일로 따로 실행)